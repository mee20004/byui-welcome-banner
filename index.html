<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Welcome to BYU-Idaho</title>
<link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <div class="banner" id="banner" role="img" aria-label="Welcome to BYU-Idaho">
    <div class="glow" id="glow" aria-hidden="true"></div>

    <div class="content">
      <div class="flagwrap" aria-hidden="true">
        <span class="pole"></span>
        <div class="flag" id="flag"></div>
      </div>
      <div class="stack">
        <h1 class="headline" id="headline" aria-hidden="true"></h1>
        <p class="sub" id="sub">Hover the words &middot; tap for a surprise</p>
      </div>
    </div>

    <div class="edges" aria-hidden="true"></div>
    <div class="sparks" id="sparks" aria-hidden="true"></div>
  </div>
  <script src="script.js?v=3"></script>
</body>
</html>
